apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ ( print .Release.Name "-cpu-gui" ) | quote }}
  labels:
    app.kubernetes.io/name: {{ ( print .Release.Name "-cpu-gui" ) | quote }}
    app.kuebrnetes.io/part-of: {{ .Release.Name | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ ( print .Release.Name "-cpu-gui" ) | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ ( print .Release.Name "-cpu-gui" ) | quote }}
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: "cpu-gui"
          image: {{ .Values.image.registry -}} / {{- .Values.image.repository -}} : {{- .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: "cpu-gui"
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ ( print .Release.Name "-cpu-gui" ) | quote }}
  labels:
    app.kubernetes.io/name: {{ ( print .Release.Name "-cpu-gui" ) | quote }}
    app.kuebrnetes.io/part-of: {{ .Release.Name | quote }}
spec:
  selector:
    app.kubernetes.io/name: {{ ( print .Release.Name "-cpu-gui" ) | quote }}
  ports:
    - name: "cpu-gui"
      port: 8000
      targetPort: "cpu-gui"
---
{{- if .Values.ingress.hostname }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ ( print .Release.Name "-cpu-gui" ) | quote }}
  labels:
    app.kubernetes.io/name: {{ ( print .Release.Name "-cpu-gui" ) | quote }}
    app.kuebrnetes.io/part-of: {{ .Release.Name | quote }}
  annotations:
    route.openshift.io/termination: "edge"
spec:
  rules:
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ ( print .Release.Name "-cpu-gui" ) | quote }}
                port:
                  number: 8000
{{- end }}